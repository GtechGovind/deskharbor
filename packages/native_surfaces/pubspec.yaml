name: native_surfaces
description: DeskHarbor native RGBA video textures.
version: 0.0.1
publish_to: none
environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'
dependencies:
  flutter:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  plugin:
    platforms:
      windows:
        pluginClass: NativeSurfacesPluginCApi
      linux:
        pluginClass: NativeSurfacesPlugin
      macos:
        pluginClass: NativeSurfacesPlugin
      android:
        package: dev.deskharbor.native_surfaces
        pluginClass: NativeSurfacesPlugin
