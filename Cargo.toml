[workspace]
resolver = "3"
members = ["crates/dh-platform", "bins/dh-platform-probe"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
